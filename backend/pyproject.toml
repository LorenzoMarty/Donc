[project]
name = "donc-enem-backend"
version = "1.0.0"
description = "Donc backend (FastAPI)"
requires-python = ">=3.11"
# Espelha backend/requirements.txt (fonte usada em Docker/local). Mantenha os dois em sincronia.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-jose[cryptography]==3.4.0",
    "bcrypt==4.2.1",
    "python-multipart==0.0.20",
    "email-validator==2.2.0",
    "openai==2.36.0",
    "httpx==0.28.1",
    "agno==2.6.5",
    "alembic==1.14.0",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "pgvector==0.3.6",
    "langfuse==2.57.12",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp==1.29.0",
    "pytest==8.3.4",
]

[tool.uv]
# App, não biblioteca: não empacota a raiz (evita exigência de build backend no `uv lock`).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: testes unitários puros (sem app/DB)",
    "integration: testes que exercitam app FastAPI + DB de teste",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/prompts/knowledge_seed/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["alembic/", "tests/", ".venv/"]

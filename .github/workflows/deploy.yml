name: Deploy

# Manual de proposito: deploy de producao so por decisao humana. Roda deploy/deploy.sh no VPS via SSH.
# Secrets necessarios: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (chave privada), DEPLOY_PATH (ex. /opt/donc),
# DEPLOY_KNOWN_HOSTS (saida de `ssh-keyscan -H <host>` coletada uma vez, de um lugar confiavel).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou sha a publicar"
        default: main
        required: true

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          REF: ${{ inputs.ref }}
        run: |
          # ref vai para um comando remoto: so caracteres de nome de branch/tag/sha (sem aspas, espaco, ;, $).
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "ref invalido" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s
' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && ./deploy/deploy.sh '$REF'"

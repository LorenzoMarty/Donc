name: Quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    # Same LanguageTool image as docker-compose.yml; `npm run quality` runs the grammar check against it.
    services:
      languagetool:
        image: erikvl87/languagetool:latest
        ports:
          - 8010:8010
        options: >-
          --health-cmd "wget -qO- http://localhost:8010/v2/languages || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run quality
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # Postgres vazio (mesma imagem do docker-compose.yml) para provar que `alembic upgrade head`
    # sobe um ambiente novo; os testes seguem em sqlite (tests/conftest.py).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m prospector
      - run: python -m pytest --cov
      - name: alembic upgrade head em banco vazio
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: |
          python -m alembic upgrade head
          python -m alembic current | grep "(head)"
          # idempotente e sem drift entre o banco bootstrapado e os models
          python -m alembic upgrade head
          python -m alembic check

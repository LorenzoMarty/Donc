# Producao em VPS unico (~2 vCPU / 4 GB). Uso: ver docs/deploy.md
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Diferencas do docker-compose.yml de dev: so o Caddy publica portas (80/443), migracao e um passo
# explicito (servico `migrate`), restart automatico e limite de memoria por servico.

x-backend-env: &backend-env
  env_file: [.env.production]
  environment:
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    SEED_DEMO_DATA: "false"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    mem_limit: 128m

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 192m

  # Passo explicito de deploy: roda `alembic upgrade head` e sai. Backend/worker so sobem depois.
  migrate:
    build:
      context: ./backend
    <<: *backend-env
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  backend:
    build:
      context: ./backend
    <<: *backend-env
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m

  worker:
    build:
      context: ./backend
    <<: *backend-env
    command: celery -A src.queues.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 768m

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/backend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      INTERNAL_API_URL: http://backend:8000/api/v1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: enem-redacao-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enem_redacao}
      POSTGRES_USER: ${POSTGRES_USER:-enem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enem}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enem} -d ${POSTGRES_DB:-enem_redacao}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enem-redacao-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: enem-redacao-api
    # backend/.env fornece OPENAI_API_KEY/OPENAI_MODEL/OPENAI_EMBEDDING_MODEL/LANGFUSE_* (nao
    # listados em `environment:` abaixo, entao vem daqui). Antes o compose so lia o .env da raiz
    # do projeto (auto-load do Docker Compose), que fica sem essas chaves — a correcao de redacao
    # rodava sempre em fallback heuristico, sem erro visivel. As chaves docker-especificas (rede
    # interna, secrets) continuam explicitas abaixo, sempre com prioridade sobre o env_file.
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enem:enem@db:5432/enem_redacao}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-before-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_SYNC_TIMEOUT_SECONDS: ${AI_SYNC_TIMEOUT_SECONDS:-45}
      ENABLE_AGENTOS: ${ENABLE_AGENTOS:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PORT: ${PORT:-8000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: enem-redacao-worker
    command: celery -A src.queues.celery_app:celery_app worker --loglevel=INFO
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enem:enem@db:5432/enem_redacao}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-before-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_SYNC_TIMEOUT_SECONDS: ${AI_SYNC_TIMEOUT_SECONDS:-45}
      ENABLE_AGENTOS: ${ENABLE_AGENTOS:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/backend
    container_name: enem-redacao-web
    environment:
      NEXT_PUBLIC_API_URL: /api/backend
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      INTERNAL_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:

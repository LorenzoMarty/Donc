services:
  db:
    image: postgres:16-alpine
    container_name: enem-redacao-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enem_redacao}
      POSTGRES_USER: ${POSTGRES_USER:-enem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enem}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enem} -d ${POSTGRES_DB:-enem_redacao}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: enem-redacao-api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://enem:enem@db:5432/enem_redacao}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-before-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: enem-redacao-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
